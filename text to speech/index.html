<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/speech.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <title>Text to Speech</title>
  </head>

  <body class="text-white bg-dark">
    <div class="container text-center mt-3">
      <div class="mb-4">
        <img src="img/images_(1)-L8WgncGEH-transformed.png" alt="" class="" />
      </div>

      <div class="row">
        <div class="col-md-6 mx-auto">
          <form>
            <div class="form-group">
              <textarea
                name=""
                id="text-input"
                class="form-control form-control-lg"
                placeholder="Type anything..."></textarea>
            </div>
            <div class="form-group">
              <label for="rate" class="mt-3">Rate</label>
              <div
                id="rate-value"
                class="badge bg-primary text-white float-end mt-3">
                1
              </div>
              <input
                type="range"
                id="rate"
                class="form-range"
                min="0.5"
                max="2"
                value="1"
                step="0.1" />
            </div>
            <div class="form-group">
              <label for="pitch" class="mt-3">Pitch</label>
              <div
                id="pitch-value"
                class="badge bg-primary text-white float-end mt-3">
                1
              </div>
              <input
                type="range"
                id="pitch"
                class="form-range"
                min="0"
                max="2"
                value="1"
                step="0.1" />
            </div>
            <div class="form-group">
              <select
                id="voice-select"
                class="form-select form-select-lg mt-2"></select>
            </div>
            <div class="d-flex justify-content-evenly align-items-center mt-3">
              <button class="btn btn-outline-primary">Speak it</button>
              <!--<button type="button" class="btn btn-outline-secondary" disabled>
                Button
              </button>-->
            </div>
          </form>
        </div>
      </div>
    </div>

    <footer class="bg-dark py-5 mt-5">
      <div
        class="container text-light text-center d-flex justify-content-center align-items-center gap-3">
        <small class="text-white">2024 &copy; | All Rights Reserved</small>
        <div>
          <a
            class="text-light"
            href="https://www.linkedin.com/in/yassir-aterta-9a3879245/"
            target="_blank"
            rel="noopener noreferrer">
            <i class="fa-brands fa-linkedin"></i>
          </a>
        </div>
      </div>
    </footer>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
